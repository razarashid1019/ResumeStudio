<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ResumeStudio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar">
    <div class="brand">
      <div class="brand-mark">RS</div>
      <div class="brand-name">ResumeStudio</div>
    </div>
    <div class="nav-items">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="jobs">
        <svg viewBox="0 0 24 24"><path d="M9 3a1 1 0 0 0-1 1v1H4.5A1.5 1.5 0 0 0 3 6.5v3.6l8.4 3.2a3 3 0 0 0 2.2 0L22 10.1V6.5A1.5 1.5 0 0 0 20.5 4H16V4a1 1 0 0 0-1-1H9zm0 2h6v1H9V5zM3 12.4V17.5A1.5 1.5 0 0 0 4.5 19h15a1.5 1.5 0 0 0 1.5-1.5v-5.1l-7.7 2.9a5 5 0 0 1-3.6 0L3 12.4z"/></svg>
        <span>Job Board</span>
      </button>
      <button class="nav-item" data-view="applications">
        <svg viewBox="0 0 24 24"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H14a1 1 0 0 1-1-1V3.5zM7 13h10v1.5H7V13zm0 4h10v1.5H7V17zm0-8h5v1.5H7V9z"/></svg>
        <span>Applications</span>
      </button>
      <button class="nav-item" data-view="interview">
        <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5zm-7 9a1 1 0 0 1 1 1 6 6 0 0 0 12 0 1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V22h-2v-2.06A8 8 0 0 1 4 12a1 1 0 0 1 1-1z"/></svg>
        <span>Interview Prep</span>
      </button>
      <button class="nav-item" data-view="resumes">
        <svg viewBox="0 0 24 24"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm1 12h10v1.5H7V14zm0-3h10v1.5H7V11zm6-8.3L18.3 8H13V2.7z"/></svg>
        <span>Resumes</span>
      </button>
    </div>
    <div class="sidebar-footer">Local · 127.0.0.1</div>
  </nav>

  <main class="content">
    <section id="view-dashboard" class="view active"></section>
    <section id="view-jobs" class="view"></section>
    <section id="view-applications" class="view"></section>
    <section id="view-interview" class="view"></section>
    <section id="view-resumes" class="view"></section>
  </main>
</div>

<div id="overlay" class="overlay hidden">
  <div class="panel">
    <button class="panel-close" id="panel-close">&times;</button>
    <div id="panel-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
